name: Download badge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/download-badge.yml
      - scripts/download-badge.jq
      - tests/check-download-badge.py
  release:
    types: [published, edited, deleted, unpublished]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check download filtering
        run: python3 tests/check-download-badge.py
      - name: Count DMG downloads across all release pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -f scripts/download-badge.jq > "$RUNNER_TEMP/downloads.json"
      - name: Publish badge data
        run: |
          # Keep generated commits out of main: release builds use its commit count.
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet refs/remotes/origin/download-badge; then
            git switch -C download-badge origin/download-badge
          else
            git switch --orphan download-badge
          fi
          cp "$RUNNER_TEMP/downloads.json" downloads.json
          git add downloads.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update DMG download count"
          git push origin HEAD:download-badge
