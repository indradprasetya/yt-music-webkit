<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="robots" content="noindex, follow">
  <title>Open Music on GitHub</title>
  <style>
    :root { color: #f0f6fc; background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100svh; margin: 0; }
    main { min-height: 100svh; display: grid; place-items: center end; padding: 0 15vw 0 5vw; box-sizing: border-box; }
    .star { width: clamp(96px, 18vw, 176px); height: auto; fill: currentColor; animation: appear 333ms ease-out both; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    footer { position: fixed; right: 24px; bottom: 20px; font-size: 13px; }
    a { color: #8b949e; text-underline-offset: 3px; }
    a:hover, a:focus-visible { color: #f0f6fc; }
    a:focus-visible { outline: 2px solid #f0f6fc; outline-offset: 4px; }
    @keyframes appear {
      from { opacity: 0; transform: scale(.75) rotate(-12deg); }
      70% { opacity: 1; transform: scale(1.08) rotate(3deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="sr-only">Opening the Music repository on GitHub. Click Star in the top-right corner to support the project.</p>
    <!--

      AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
      LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
      OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE.
    -->
    <svg class="star" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/>
    </svg>
  </main>
  <footer><a href="https://github.com/indradprasetya/yt-music-webkit">Open GitHub now</a></footer>
  <script>
    window.addEventListener('load', () => {
      window.setTimeout(() => {
        window.location.replace('https://github.com/indradprasetya/yt-music-webkit');
      }, 333);
    });
  </script>
</body>
</html>
