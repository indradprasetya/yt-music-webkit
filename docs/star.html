<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="robots" content="noindex, follow">
  <title>Open Music on GitHub</title>
  <style>
    :root { background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100svh; margin: 0; }
    main { min-height: 100svh; position: relative; }
    .star { position: absolute; top: 12%; right: 9.5%; height: 28px; display: inline-flex; align-items: center; border: 1px solid #3d444d; border-radius: 6px; background: #21262d; color: #f0f6fc; font-size: 13px; font-weight: 600; line-height: 1; text-decoration: none; animation: appear 180ms ease-out both; }
    .star:hover { background: #30363d; }
    .star:focus-visible { outline: 2px solid #f0f6fc; outline-offset: 4px; }
    .star-label { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; }
    .star svg { width: 16px; height: 16px; fill: currentColor; }
    .count { padding: 3px 5px; border-radius: 10px; background: #30363d; font-size: 12px; }
    .caret { width: 27px; height: 100%; display: grid; place-items: center; border-left: 1px solid #3d444d; color: #8b949e; }
    .caret::after { content: ""; border-right: 4px solid transparent; border-left: 4px solid transparent; border-top: 4px solid currentColor; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 600px) { .star { top: 48px; right: 24px; } }
    @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="sr-only" role="status">Opening the Music repository. Click the Star button on GitHub to support the project.</p>
    <!--
      GitHub Octicons star-16 icon: https://github.com/primer/octicons
      MIT License. Copyright (c) 2026 GitHub Inc.

      of this software and associated documentation files (the "Software"), to deal
      in the Software without restriction, including without limitation the rights
      to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
      copies of the Software, and to permit persons to whom the Software is
      furnished to do so, subject to the following conditions:

      The above copyright notice and this permission notice shall be included in all
      copies or substantial portions of the Software.

      THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
      IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
      AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
      LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
      OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
      SOFTWARE.
    -->
    <a class="star" href="https://github.com/indradprasetya/yt-music-webkit/tree/main" aria-label="Open the repository to click Star on GitHub">
      <span class="star-label">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/>
        </svg>
        Star <span class="count" aria-hidden="true">0</span>
      </span>
      <span class="caret" aria-hidden="true"></span>
    </a>
  </main>
  <script>
    window.addEventListener('load', () => {
      window.setTimeout(() => {
        window.location.replace('https://github.com/indradprasetya/yt-music-webkit/tree/main');
      }, 1000);
    });
  </script>
</body>
</html>
